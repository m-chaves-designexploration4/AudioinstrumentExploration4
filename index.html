<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Audio Instrument</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/tone"></script>
    <script src="main.js" defer></script>
</head>
<body>
<dialog id="intro-dialog">
    <p>
    <h2>This page is intended to play sounds. Please check your system's volume level</h2>
    <p>Player 1 controls the mouse</p>
    <p>Player 2 controls the keyboard</p>

    <button id="intro-dialog-close">
        OK
    </button>
</dialog>


<header>
    <h1>Audio Instrument</h1>
</header>

<div class="app-container">
    <!-- PLAYER 1: WORKSPACE (Left Side) -->
    <aside class="panel player-panel" id="player1-panel">
        <h2>Player 1 Controls</h2>

        <div class="control-group">
            <button id="playPauseBtn" class="primary-btn">▶ Play</button>
            <button id="spawnBallBtn" class="action-btn">+ Add Note</button>
        </div>

        <div class="control-group">
            <label for="waveType">Waveform</label>
            <select id="waveType">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="triangle">Triangle</option>
                <option value="sawtooth">Sawtooth</option>
            </select>
        </div>

        <div class="control-group">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="40" max="240" value="120">
        </div>

        <div class="control-group">
            <label for="volumeSlider">Volume</label>
            <input type="range" id="volumeSlider" min="-30" max="0" value="-6" step="1">
        </div>

        <div class="p2-info-box">
            <h3>Player 2 Controls</h3>
            <p><strong>arrow keys</strong></p>
            <p><strong>Spacebar</strong></p>
            <p><strong>Backspace</strong></p>
        </div>
    </aside>

    <main class="panel stave-center" id="staveZone">
        <div id="playhead"></div>
    </main>
</div>

</body>
</html>
